<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eldegrün Treuekarte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #2d4a3a;
    --forest-dark: #1d3327;
    --terracotta: #c17a52;
    --terracotta-dark: #a8643e;
    --copper: #b8824f;
    --cream: #f7f4ee;
    --cream-dim: #ece6da;
    --ink: #2a2a24;
    --ink-soft: #6b6a5f;
    --line: #ddd6c6;
    --white: #ffffff;
    --slate: #5b6b72;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --cream: #1c1d18;
      --cream-dim: #26271f;
      --ink: #ece7da;
      --ink-soft: #a8a292;
      --line: #3a3b31;
      --white: #232419;
    }
  }
  :root[data-theme="dark"] {
    --cream: #1c1d18;
    --cream-dim: #26271f;
    --ink: #ece7da;
    --ink-soft: #a8a292;
    --line: #3a3b31;
    --white: #232419;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 20px 48px;
    min-height: 100vh;
  }
  h1, h2, h3 { font-family: 'Fraunces', serif; }

  /* ---------- Top brand bar ---------- */
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
  }
  .brand-mark {
    width: 40px; height: 40px;
    border-radius: 50%;
    flex-shrink: 0;
    overflow: hidden;
    border: 1.5px solid var(--copper);
    background: var(--white);
  }
  .brand-mark img { width: 100%; height: 100%; object-fit: cover; }
  .brand-name {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--forest);
    letter-spacing: 0.01em;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .brand-name { color: #8fb89e; }
  }
  :root[data-theme="dark"] .brand-name { color: #8fb89e; }

  /* ---------- Card ---------- */
  .card {
    background: linear-gradient(155deg, var(--forest) 0%, var(--forest-dark) 100%);
    border-radius: 20px;
    padding: 28px 24px 24px;
    color: var(--cream);
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 28px rgba(29, 51, 39, 0.3);
  }
  .card::before {
    content: "";
    position: absolute;
    top: -60px; right: -60px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(184,130,79,0.25), transparent 70%);
  }
  .card-top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    position: relative; z-index: 1;
  }
  .card-logo {
    width: 46px; height: 46px;
    border-radius: 50%;
    overflow: hidden;
    border: 1.5px solid rgba(247,244,238,0.4);
    flex-shrink: 0;
    background: var(--white);
  }
  .card-logo img { width: 100%; height: 100%; object-fit: cover; }
  .card-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: rgba(247,244,238,0.6);
    margin-bottom: 4px;
  }
  .card-title {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .card-sub {
    font-size: 0.88rem;
    color: rgba(247,244,238,0.72);
    margin-bottom: 22px;
  }
  .card-text-block { flex: 1; }

  .stamps-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    position: relative;
    z-index: 1;
  }
  .stamp {
    aspect-ratio: 1;
    border-radius: 50%;
    border: 1.5px dashed rgba(247,244,238,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1), border-color 0.3s;
  }
  .stamp.filled {
    border: none;
    background: var(--terracotta);
    animation: pop 0.45s cubic-bezier(.34,1.56,.64,1);
  }
  .stamp.reward {
    border: 1.5px solid rgba(247,244,238,0.5);
  }
  .stamp.reward.filled {
    background: #e3b84f;
  }
  .stamp svg { width: 54%; height: 54%; }
  .stamp-num {
    font-size: 0.65rem;
    color: rgba(247,244,238,0.3);
    font-weight: 600;
  }
  .stamp.filled .stamp-num { display: none; }
  @keyframes pop {
    0% { transform: scale(0.3); opacity: 0; }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  .progress-text {
    margin-top: 18px;
    font-size: 0.85rem;
    color: rgba(247,244,238,0.85);
    position: relative; z-index: 1;
  }
  .progress-text b { color: var(--cream); }

  /* ---------- Reward banner ---------- */
  .reward-banner {
    margin-top: 16px;
    background: rgba(227,184,79,0.16);
    border: 1px solid rgba(227,184,79,0.4);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 0.85rem;
    color: #f3dfa0;
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative; z-index: 1;
  }
  .reward-banner svg { width: 20px; height: 20px; flex-shrink: 0; }

  /* ---------- Message banner (from business to customer) ---------- */
  .msg-banner {
    margin-top: 16px;
    background: rgba(247,244,238,0.1);
    border: 1px solid rgba(247,244,238,0.22);
    border-radius: 12px;
    padding: 13px 14px;
    position: relative; z-index: 1;
  }
  .msg-banner-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: rgba(247,244,238,0.55);
    margin-bottom: 4px;
  }
  .msg-banner-text {
    font-size: 0.86rem;
    color: var(--cream);
    line-height: 1.45;
  }
  .msg-banner-date {
    font-size: 0.7rem;
    color: rgba(247,244,238,0.45);
    margin-top: 6px;
  }

  /* ---------- Info section ---------- */
  .section {
    margin-top: 28px;
  }
  .section-title {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .history {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .history-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.88rem;
  }
  .history-row:last-child { border-bottom: none; }
  .history-date { color: var(--ink-soft); font-size: 0.8rem; }
  .history-empty {
    color: var(--ink-soft);
    font-size: 0.88rem;
    padding: 18px 0;
    text-align: center;
  }

  .how-box {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    font-size: 0.85rem;
    color: var(--ink-soft);
    line-height: 1.55;
  }

  /* ---------- Buttons / inputs shared ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 20px;
    border-radius: 11px;
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.92rem;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--terracotta); color: white; }
  .btn-primary:hover { background: var(--terracotta-dark); }
  .btn-ghost { background: transparent; color: var(--forest); border: 1.5px solid var(--line); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-ghost { color: #8fb89e; } }
  :root[data-theme="dark"] .btn-ghost { color: #8fb89e; }
  .btn-block { width: 100%; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-danger { background: transparent; color: #b5563d; border: 1.5px solid rgba(181,86,61,0.35); }

  input[type="text"], input[type="password"], textarea {
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: var(--white);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
  }
  textarea { resize: vertical; min-height: 70px; font-family: 'Inter', sans-serif; }
  input[type="text"]:focus, input[type="password"]:focus, textarea:focus {
    outline: none;
    border-color: var(--terracotta);
  }

  /* ---------- Loading / empty states ---------- */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }
  .spin {
    width: 22px; height: 22px;
    border: 2.5px solid var(--line);
    border-top-color: var(--terracotta);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Admin ---------- */
  .admin-wrap { max-width: 540px; }
  .admin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    gap: 10px;
  }
  .admin-title { font-size: 1.25rem; font-weight: 600; color: var(--forest); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .admin-title { color: #8fb89e; } }
  :root[data-theme="dark"] .admin-title { color: #8fb89e; }

  .customer-card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .customer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .customer-name { font-weight: 600; font-size: 0.98rem; }
  .customer-meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 2px; }
  .mini-stamps {
    display: flex;
    gap: 3px;
    margin-top: 10px;
  }
  .mini-dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    flex-shrink: 0;
  }
  .mini-dot.filled { background: var(--terracotta); border-color: var(--terracotta); }
  .mini-dot.reward.filled { background: #e3b84f; border-color: #e3b84f; }

  .action-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .action-row .btn { padding: 9px 14px; font-size: 0.8rem; flex: 1; min-width: 100px; }

  .stamp-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--forest);
    color: white;
    border: none;
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .stamp-btn:active { transform: scale(0.92); }
  .stamp-btn:disabled { opacity: 0.35; }

  .new-customer-box {
    background: var(--white);
    border: 1.5px dashed var(--line);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 20px;
  }
  .new-customer-box .btn { margin-top: 10px; }

  .link-reveal {
    margin-top: 10px;
    background: var(--cream-dim);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.78rem;
    word-break: break-all;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .link-reveal button {
    background: var(--forest);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }

  .empty-admin {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }

  .gate {
    max-width: 380px;
    margin: 14vh auto 0;
    text-align: center;
    padding: 0 24px;
  }
  .gate-logo {
    width: 64px; height: 64px;
    border-radius: 50%;
    margin: 0 auto 18px;
    overflow: hidden;
    border: 2px solid var(--copper);
  }
  .gate-logo img { width: 100%; height: 100%; object-fit: cover; }
  .gate h2 { font-size: 1.3rem; margin-bottom: 8px; color: var(--forest); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .gate h2 { color: #8fb89e; } }
  :root[data-theme="dark"] .gate h2 { color: #8fb89e; }
  .gate p { font-size: 0.88rem; color: var(--ink-soft); margin-bottom: 18px; line-height: 1.5; }
  .gate input { margin-bottom: 12px; }
  .gate-error { color: #b5563d; font-size: 0.82rem; margin-top: 8px; min-height: 1.2em; }
  .gate-lockout { color: #b5563d; font-size: 0.82rem; margin-top: 8px; }

  .toast {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%) translateY(0);
    background: var(--forest);
    color: var(--cream);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 500;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 100;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-6px);
  }

  .footer-note {
    text-align: center;
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin-top: 32px;
    opacity: 0.7;
  }

  /* ---------- Message modal ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(29,51,39,0.5);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 200;
    padding: 0;
  }
  .modal-box {
    background: var(--cream);
    border-radius: 20px 20px 0 0;
    padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px));
    width: 100%;
    max-width: 480px;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal-title { font-size: 1.1rem; font-weight: 600; color: var(--forest); margin-bottom: 4px; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .modal-title { color: #8fb89e; } }
  :root[data-theme="dark"] .modal-title { color: #8fb89e; }
  .modal-sub { font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
  .modal-actions .btn { flex: 1; }
</style>
</head>
<body>

<div id="app"><div class="loading"><div class="spin"></div>Lädt …</div></div>

<div id="toast" class="toast"></div>

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function genId(name) {
  const slug = name.toLowerCase()
    .replace(/[äöü]/g, c => ({ä:'ae',ö:'oe',ü:'ue'}[c]))
    .replace(/ß/g, 'ss')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/(^-|-$)/g, '')
    .slice(0, 20);
  const rand = Math.random().toString(36).slice(2, 6) + Date.now().toString(36).slice(-4);
  return (slug || 'kunde') + '-' + rand;
}

function formatDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function formatDateTime(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ' · ' +
         d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
}

// --- simple password hashing using Web Crypto, so the admin password
// is never stored or compared in plain text, even inside this page's source ---
async function sha256(text) {
  const enc = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function renderStampsGrid(stamps, total) {
  let html = '';
  for (let i = 0; i < total; i++) {
    const isReward = (i + 1) === total;
    const filled = i < stamps;
    const cls = ['stamp'];
    if (filled) cls.push('filled');
    if (isReward) cls.push('reward');
    const icon = isReward ? giftIcon : (filled ? leafIcon : '');
    html += `<div class="${cls.join(' ')}">${filled ? icon : `<span class="stamp-num">${i+1}</span>`}</div>`;
  }
  return html;
}

function renderMiniStamps(stamps, total) {
  let html = '';
  for (let i = 0; i < total; i++) {
    const isReward = (i + 1) === total;
    const filled = i < stamps;
    const cls = ['mini-dot'];
    if (filled) cls.push('filled');
    if (isReward) cls.push('reward');
    html += `<div class="${cls.join(' ')}"></div>`;
  }
  return html;
}

async function boot() {
  const db = await claude.use("db");
  const params = new URLSearchParams(location.search);
  const kundeId = params.get('kunde');
  const isAdmin = params.get('admin') === '1';

  if (!db) {
    document.getElementById('app').innerHTML = `
      <div class="wrap">
        <div class="loading" style="flex-direction:column;gap:10px;">
          <div>Diese Seite braucht eine Verbindung zur Datenspeicherung.</div>
          <div style="font-size:0.8rem;opacity:0.7;">Bitte über den claude.ai Link öffnen.</div>
        </div>
      </div>`;
    return;
  }

  if (isAdmin) {
    renderAdminGate(db);
  } else if (kundeId) {
    renderCustomerCard(db, kundeId);
  } else {
    renderLanding();
  }
}

function renderLanding() {
  document.getElementById('app').innerHTML = `
    <div class="wrap">
      <div class="gate">
        <div class="gate-logo"><img src="${LOGO_SRC}" alt="Eldegrün Logo"></div>
        <h2>Treuekarte</h2>
        <p>Diese Seite braucht einen persönlichen Link. Hol dir deine Karte bei deinem Eldegrün-Ansprechpartner, oder öffne die Verwaltung.</p>
        <a href="?admin=1" class="btn btn-ghost btn-block">Zur Verwaltung</a>
      </div>
    </div>`;
}

// ============== CUSTOMER VIEW ==============
function renderCustomerCard(db, kundeId) {
  const ref = db.doc('kunden/' + kundeId);

  function paint(data) {
    if (!data) {
      document.getElementById('app').innerHTML = `
        <div class="wrap">
          <div class="gate">
            <div class="gate-logo"><img src="${LOGO_SRC}" alt="Eldegrün Logo"></div>
            <h2>Karte nicht gefunden</h2>
            <p>Dieser Link ist ungültig oder die Karte wurde noch nicht angelegt. Bitte wende dich an deinen Eldegrün-Ansprechpartner.</p>
          </div>
        </div>`;
      return;
    }

    const stamps = data.stamps || 0;
    const name = data.name || 'Kunde';
    const history = (data.history || []).slice().reverse();
    const earnedReward = stamps >= TOTAL_STAMPS;
    const remaining = TOTAL_STAMPS - stamps;
    const message = data.message;
    const showMessage = message && message.text && (!message.readAt);

    // mark message as delivered/seen (not deleting it, just tracking)
    if (message && message.text && !message.seenAt) {
      ref.update({ 'message.seenAt': Date.now() }).catch(()=>{});
    }

    document.getElementById('app').innerHTML = `
      <div class="wrap">
        <div class="brand">
          <div class="brand-mark"><img src="${LOGO_SRC}" alt="Eldegrün Logo"></div>
          <div class="brand-name">Eldegrün</div>
        </div>

        <div class="card">
          <div class="card-top-row">
            <div class="card-text-block">
              <div class="card-label">Treuekarte</div>
              <div class="card-title" id="custName"></div>
              <div class="card-sub">Garten- &amp; Gebäudeservice</div>
            </div>
            <div class="card-logo"><img src="${LOGO_SRC}" alt=""></div>
          </div>

          <div class="stamps-grid">${renderStampsGrid(stamps, TOTAL_STAMPS)}</div>

          <div class="progress-text">
            ${earnedReward
              ? `<b>Geschafft!</b> Deine Prämie steht bereit.`
              : `Noch <b>${remaining}</b> ${remaining === 1 ? 'Einsatz' : 'Einsätze'} bis zur Prämie.`}
          </div>

          ${earnedReward ? `
          <div class="reward-banner">
            ${giftIcon.replace('currentColor','#f3dfa0')}
            <span>Zeig diese Karte beim nächsten Termin – dein nächster Einsatz ist kostenlos.</span>
          </div>` : ''}

          ${message && message.text ? `
          <div class="msg-banner">
            <div class="msg-banner-label">Nachricht von Eldegrün</div>
            <div class="msg-banner-text">${escapeHtml(message.text)}</div>
            <div class="msg-banner-date">${formatDateTime(message.sentAt)}</div>
          </div>` : ''}
        </div>

        <div class="section">
          <div class="section-title">Verlauf</div>
          <div class="history">
            ${history.length ? history.map(h => `
              <div class="history-row">
                <span>${escapeHtml(h.label || 'Einsatz')}</span>
                <span class="history-date">${formatDate(h.ts)}</span>
              </div>`).join('') : '<div class="history-empty">Noch keine Einträge</div>'}
          </div>
        </div>

        <div class="section">
          <div class="section-title">So funktioniert's</div>
          <div class="how-box">
            Nach jedem abgeschlossenen Einsatz trägt dein Eldegrün-Team einen Stempel ein.
            Nach ${TOTAL_STAMPS} Stempeln bekommst du den ${TOTAL_STAMPS}. Einsatz geschenkt.
            Diese Karte ist persönlich – einfach diesen Link als Lesezeichen speichern, um sie wiederzufinden.
          </div>
        </div>

        <div class="footer-note">Eldegrün · Garten- und Gebäudeservice · Parchim</div>
      </div>
    `;
    document.getElementById('custName').textContent = name;
  }

  ref.onSnapshot(
    (snap) => paint(snap.exists ? snap.data : null),
    (err) => {
      document.getElementById('app').innerHTML = `<div class="wrap"><div class="loading">Verbindung fehlgeschlagen. Bitte Seite neu laden.</div></div>`;
    }
  );
}

// ============== ADMIN GATE (secured) ==============
const SESSION_KEY = 'eldegruen_admin_session';
const SESSION_TTL_MS = 1000 * 60 * 60 * 8; // 8 Stunden
const MAX_ATTEMPTS = 5;
const LOCKOUT_MS = 1000 * 60 * 5; // 5 Minuten Sperre nach zu vielen Fehlversuchen

function getFailState() {
  try {
    return JSON.parse(localStorage.getItem('eldegruen_fail_state') || '{}');
  } catch(e) { return {}; }
}
function setFailState(s) {
  try { localStorage.setItem('eldegruen_fail_state', JSON.stringify(s)); } catch(e) {}
}

async function renderAdminGate(db) {
  // check existing session
  const sessionRaw = sessionStorage.getItem(SESSION_KEY);
  if (sessionRaw) {
    try {
      const session = JSON.parse(sessionRaw);
      if (session.expires > Date.now()) {
        renderAdminPanel(db);
        return;
      }
    } catch(e) {}
    sessionStorage.removeItem(SESSION_KEY);
  }

  // check lockout
  const fail = getFailState();
  const lockedUntil = fail.lockedUntil || 0;
  const isLocked = lockedUntil > Date.now();

  document.getElementById('app').innerHTML = `
    <div class="wrap">
      <div class="gate">
        <div class="gate-logo"><img src="${LOGO_SRC}" alt="Eldegrün Logo"></div>
        <h2>Verwaltung</h2>
        <p>Passwort eingeben, um Stempel zu vergeben, Karten zu verwalten und Nachrichten zu senden.</p>
        <input type="password" id="codeInput" placeholder="Passwort" autocomplete="current-password" ${isLocked ? 'disabled' : ''}>
        <button class="btn btn-primary btn-block" id="gateBtn" ${isLocked ? 'disabled' : ''}>Anmelden</button>
        <div class="gate-error" id="gateErr"></div>
      </div>
    </div>`;

  const input = document.getElementById('codeInput');
  const btn = document.getElementById('gateBtn');
  const err = document.getElementById('gateErr');

  if (isLocked) {
    const mins = Math.ceil((lockedUntil - Date.now()) / 60000);
    err.textContent = `Zu viele Fehlversuche. Bitte in ${mins} Minute(n) erneut versuchen.`;
    return;
  }

  async function tryLogin() {
    const val = input.value;
    if (!val) return;
    btn.disabled = true;
    btn.textContent = 'Prüfe …';

    // read the stored password hash from db (set on first use)
    const configRef = db.doc('config/admin');
    let configSnap;
    try {
      configSnap = await configRef.get();
    } catch(e) {
      err.textContent = 'Verbindungsfehler. Bitte erneut versuchen.';
      btn.disabled = false;
      btn.textContent = 'Anmelden';
      return;
    }

    const inputHash = await sha256(val);

    if (!configSnap.exists) {
      // first time setup: this becomes the password
      try {
        await configRef.set({ passwordHash: inputHash, setAt: Date.now() });
        sessionStorage.setItem(SESSION_KEY, JSON.stringify({ expires: Date.now() + SESSION_TTL_MS }));
        setFailState({});
        toast('Passwort festgelegt. Gut merken!');
        renderAdminPanel(db);
      } catch(e) {
        err.textContent = 'Fehler beim Einrichten. Bitte erneut versuchen.';
        btn.disabled = false;
        btn.textContent = 'Anmelden';
      }
      return;
    }

    const storedHash = configSnap.data.passwordHash;
    if (inputHash === storedHash) {
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({ expires: Date.now() + SESSION_TTL_MS }));
      setFailState({});
      renderAdminPanel(db);
    } else {
      const fail = getFailState();
      const attempts = (fail.attempts || 0) + 1;
      if (attempts >= MAX_ATTEMPTS) {
        setFailState({ attempts: 0, lockedUntil: Date.now() + LOCKOUT_MS });
        err.textContent = `Zu viele Fehlversuche. Bitte in ${Math.ceil(LOCKOUT_MS/60000)} Minuten erneut versuchen.`;
        input.disabled = true;
        btn.disabled = true;
      } else {
        setFailState({ attempts });
        err.textContent = `Falsches Passwort. Noch ${MAX_ATTEMPTS - attempts} Versuch(e).`;
        input.value = '';
        input.focus();
        btn.disabled = false;
        btn.textContent = 'Anmelden';
      }
    }
  }

  btn.addEventListener('click', tryLogin);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryLogin(); });
  input.focus();
}

// ============== ADMIN PANEL ==============
function renderAdminPanel(db) {
  const col = db.collection('kunden');
  let currentCustomers = [];

  function shell() {
    document.getElementById('app').innerHTML = `
      <div class="wrap admin-wrap">
        <div class="admin-header">
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="brand-mark" style="width:32px;height:32px;"><img src="${LOGO_SRC}" alt=""></div>
            <div class="admin-title">Verwaltung</div>
          </div>
          <button class="btn btn-ghost" id="logoutBtn" style="padding:8px 14px;font-size:0.8rem;">Abmelden</button>
        </div>

        <div class="new-customer-box">
          <div class="section-title" style="margin-bottom:8px;">Neue Karte anlegen</div>
          <input type="text" id="newNameInput" placeholder="Name des Kunden">
          <button class="btn btn-primary btn-block" id="addCustomerBtn">Karte erstellen</button>
        </div>

        <div class="section-title">Kunden (<span id="custCount">0</span>)</div>
        <div id="customerList"></div>

        <div class="footer-note" style="margin-top:36px;">
          Passwort ändern: <a href="#" id="changePwLink" style="color:inherit;text-decoration:underline;">hier klicken</a>
        </div>
      </div>
    `;

    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem(SESSION_KEY);
      renderAdminGate(db);
    });

    document.getElementById('addCustomerBtn').addEventListener('click', addCustomer);
    document.getElementById('newNameInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addCustomer();
    });
    document.getElementById('changePwLink').addEventListener('click', (e) => {
      e.preventDefault();
      openChangePasswordModal();
    });
  }

  function openChangePasswordModal() {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <div class="modal-title">Passwort ändern</div>
        <div class="modal-sub">Neues Passwort für die Verwaltung festlegen.</div>
        <input type="password" id="pwNew1" placeholder="Neues Passwort" style="margin-bottom:10px;">
        <input type="password" id="pwNew2" placeholder="Neues Passwort wiederholen">
        <div class="gate-error" id="pwErr"></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="pwCancel">Abbrechen</button>
          <button class="btn btn-primary" id="pwSave">Speichern</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById('pwCancel').addEventListener('click', () => overlay.remove());
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    document.getElementById('pwSave').addEventListener('click', async () => {
      const p1 = document.getElementById('pwNew1').value;
      const p2 = document.getElementById('pwNew2').value;
      const errEl = document.getElementById('pwErr');
      if (p1.length < 6) { errEl.textContent = 'Mindestens 6 Zeichen.'; return; }
      if (p1 !== p2) { errEl.textContent = 'Passwörter stimmen nicht überein.'; return; }
      const hash = await sha256(p1);
      try {
        await db.doc('config/admin').set({ passwordHash: hash, setAt: Date.now() });
        toast('Passwort geändert');
        overlay.remove();
      } catch(e) {
        errEl.textContent = 'Fehler beim Speichern.';
      }
    });
  }

  async function addCustomer() {
    const input = document.getElementById('newNameInput');
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    const btn = document.getElementById('addCustomerBtn');
    btn.disabled = true;
    btn.textContent = 'Erstelle …';
    try {
      const id = genId(name);
      await col.doc(id).set({
        name: name,
        stamps: 0,
        history: [],
        createdAt: Date.now()
      });
      input.value = '';
      toast('Karte für ' + name + ' erstellt');
    } catch (e) {
      toast('Fehler beim Erstellen');
    }
    btn.disabled = false;
    btn.textContent = 'Karte erstellen';
  }

  function renderList() {
    const listEl = document.getElementById('customerList');
    const countEl = document.getElementById('custCount');
    if (!listEl) return;
    countEl.textContent = currentCustomers.length;

    if (currentCustomers.length === 0) {
      listEl.innerHTML = `<div class="empty-admin">Noch keine Kunden angelegt.<br>Lege oben die erste Karte an.</div>`;
      return;
    }

    const sorted = currentCustomers.slice().sort((a,b) => (b.createdAt||0) - (a.createdAt||0));

    listEl.innerHTML = sorted.map(c => {
      const stamps = c.stamps || 0;
      const full = stamps >= TOTAL_STAMPS;
      const link = location.origin + location.pathname + '?kunde=' + c.id;
      const hasUnseenMsg = c.message && c.message.text && !c.message.seenAt;
      return `
        <div class="customer-card">
          <div class="customer-row">
            <div>
              <div class="customer-name">${escapeHtml(c.name)}</div>
              <div class="customer-meta">${stamps} / ${TOTAL_STAMPS} Stempel${full ? ' · Prämie bereit' : ''}${hasUnseenMsg ? ' · Nachricht ungelesen' : ''}</div>
            </div>
            <button class="stamp-btn" data-id="${c.id}" data-action="stamp" ${full ? 'disabled' : ''} title="Stempel hinzufügen">+</button>
          </div>
          <div class="mini-stamps">${renderMiniStamps(stamps, TOTAL_STAMPS)}</div>
          <div class="action-row">
            <button class="btn btn-ghost" data-id="${c.id}" data-action="message">Nachricht senden</button>
            ${full ? `<button class="btn btn-ghost" data-id="${c.id}" data-action="redeem">Prämie einlösen</button>` : ''}
            <button class="btn btn-danger" data-id="${c.id}" data-action="delete">Löschen</button>
          </div>
          <div class="link-reveal">
            <span>${link}</span>
            <button data-action="copy" data-link="${link}">Kopieren</button>
          </div>
        </div>
      `;
    }).join('');

    listEl.querySelectorAll('[data-action="stamp"]').forEach(btn => {
      btn.addEventListener('click', () => addStamp(btn.dataset.id));
    });
    listEl.querySelectorAll('[data-action="copy"]').forEach(btn => {
      btn.addEventListener('click', () => {
        navigator.clipboard.writeText(btn.dataset.link).then(() => toast('Link kopiert')).catch(() => toast('Kopieren nicht möglich'));
      });
    });
    listEl.querySelectorAll('[data-action="redeem"]').forEach(btn => {
      btn.addEventListener('click', () => redeemReward(btn.dataset.id));
    });
    listEl.querySelectorAll('[data-action="message"]').forEach(btn => {
      btn.addEventListener('click', () => openMessageModal(btn.dataset.id));
    });
    listEl.querySelectorAll('[data-action="delete"]').forEach(btn => {
      btn.addEventListener('click', () => confirmDelete(btn.dataset.id));
    });
  }

  function openMessageModal(id) {
    const customer = currentCustomers.find(c => c.id === id);
    if (!customer) return;
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <div class="modal-title">Nachricht an ${escapeHtml(customer.name)}</div>
        <div class="modal-sub">Erscheint direkt auf der Treuekarte des Kunden.</div>
        <textarea id="msgText" placeholder="z. B. Danke für deine Treue! Diese Woche 10% auf Heckenschnitt.">${customer.message && customer.message.text ? escapeHtml(customer.message.text) : ''}</textarea>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="msgCancel">Abbrechen</button>
          <button class="btn btn-primary" id="msgSend">Senden</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById('msgCancel').addEventListener('click', () => overlay.remove());
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    document.getElementById('msgSend').addEventListener('click', async () => {
      const text = document.getElementById('msgText').value.trim();
      try {
        await col.doc(id).update({
          message: text ? { text, sentAt: Date.now(), seenAt: null } : null
        });
        toast(text ? 'Nachricht gesendet' : 'Nachricht entfernt');
        overlay.remove();
      } catch(e) {
        toast('Fehler beim Senden');
      }
    });
  }

  function confirmDelete(id) {
    const customer = currentCustomers.find(c => c.id === id);
    if (!customer) return;
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <div class="modal-title">Karte löschen?</div>
        <div class="modal-sub">Die Karte von ${escapeHtml(customer.name)} wird dauerhaft entfernt. Das kann nicht rückgängig gemacht werden.</div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="delCancel">Abbrechen</button>
          <button class="btn btn-danger" id="delConfirm" style="flex:1;">Endgültig löschen</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById('delCancel').addEventListener('click', () => overlay.remove());
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    document.getElementById('delConfirm').addEventListener('click', async () => {
      try {
        await col.doc(id).delete();
        toast('Karte gelöscht');
        overlay.remove();
      } catch(e) {
        toast('Fehler beim Löschen');
      }
    });
  }

  async function addStamp(id) {
    const customer = currentCustomers.find(c => c.id === id);
    if (!customer) return;
    const newStamps = Math.min((customer.stamps || 0) + 1, TOTAL_STAMPS);
    const newHistory = (customer.history || []).concat([{
      label: 'Einsatz bestätigt',
      ts: Date.now()
    }]);
    try {
      await col.doc(id).update({ stamps: newStamps, history: newHistory });
      toast('Stempel hinzugefügt');
    } catch (e) {
      toast('Fehler beim Speichern');
    }
  }

  async function redeemReward(id) {
    const customer = currentCustomers.find(c => c.id === id);
    if (!customer) return;
    const newHistory = (customer.history || []).concat([{
      label: 'Prämie eingelöst',
      ts: Date.now()
    }]);
    try {
      await col.doc(id).update({ stamps: 0, history: newHistory });
      toast('Prämie eingelöst – Karte zurückgesetzt');
    } catch (e) {
      toast('Fehler beim Speichern');
    }
  }

  shell();

  col.onSnapshot(
    (snap) => {
      currentCustomers = snap.docs.map(d => ({ id: d.id.split('/').pop(), ...d.data }));
      renderList();
    },
    (err) => {
      toast('Verbindung verloren');
    }
  );
}

boot();
</script>
